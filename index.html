<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealHunter | Valuta il tuo Smartphone</title>
    <meta name="description" content="DealHunter - Scopri se il prezzo del tuo smartphone usato è quello giusto grazie al Machine Learning.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1B6BB2;
            --secondary: #EA7900;
            --bg: #f8fafc;
            --text: #1e293b;
            --glass: rgba(255, 255, 255, 0.8);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, #1557a0 100%);
            padding: 2rem 1rem;
            text-align: center;
            color: white;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .logo-container {
            margin-bottom: 1rem;
        }

        .logo-container img {
            max-width: 300px;
            width: 80%;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.5rem 3rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .hero h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: #64748b;
            font-size: 1.1rem;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            margin-bottom: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
        }

        select, input {
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            ring: 2px solid var(--primary);
        }

        .toggle-group {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button#predict-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
            box-shadow: 0 4px 14px 0 rgba(27, 107, 178, 0.39);
        }

        button#predict-btn:hover {
            background-color: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(234, 121, 0, 0.4);
        }

        button#predict-btn:active {
            transform: translateY(0);
        }

        #result-display {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            color: white;
            margin-bottom: 1.5rem;
        }

        .result-Budget { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); }
        .result-Mid-Range { background: linear-gradient(135deg, var(--primary) 0%, #1557a0 100%); }
        .result-High-End { background: linear-gradient(135deg, var(--secondary) 0%, #d16d00 100%); }
        .result-Premium { background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%); }

        .result-box h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .result-box p { font-size: 1.4rem; font-weight: 600; }

        .metric-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .metric {
            text-align: center;
            padding: 1rem 2rem;
            background: white;
            border-radius: 1rem;
            box-shadow: var(--shadow);
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .metric-label {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .chart-container {
            margin-top: 2rem;
        }

        .chart-bar {
            height: 2rem;
            background: #e2e8f0;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
        }

        .chart-fill {
            height: 100%;
            background: var(--primary);
            transition: width 1s ease-in-out;
        }

        .chart-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
            font-size: 0.9rem;
            border-top: 1px solid #e2e8f0;
        }

        hr {
            border: 0;
            border-top: 1px solid var(--secondary);
            margin: 2rem 0;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="src/img/MainLogo.png" alt="DealHunter Logo" onerror="this.src='https://via.placeholder.com/300x100?text=DealHunter'">
        </div>
        <p>Valutazione smartphone basata su Machine Learning</p>
    </header>

    <div class="container">
        <section class="hero">
            <h1>📊 Analisi del Prezzo Giusto</h1>
            <p>Inserisci le specifiche tecniche del tuo dispositivo per una stima immediata.</p>
        </section>

        <section class="card">
            <div class="grid">
                <div class="form-group">
                    <label for="brand">🏷️ Marca</label>
                    <select id="brand">
                        <option value="Samsung">Samsung</option>
                        <option value="Apple">Apple</option>
                        <option value="Huawei">Huawei</option>
                        <option value="Xiaomi">Xiaomi</option>
                        <option value="Oppo">Oppo</option>
                        <option value="Others">Altro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ram">💾 RAM (GB)</label>
                    <input type="number" id="ram" value="4" step="0.5" min="0.5">
                </div>
                <div class="form-group">
                    <label for="memory">📦 Memoria (GB)</label>
                    <input type="number" id="memory" value="64" step="8">
                </div>
                <div class="form-group">
                    <label for="year">📅 Anno di Uscita</label>
                    <input type="number" id="year" value="2020" min="2010" max="2026">
                </div>
                <div class="form-group">
                    <label for="rear_cam">📸 Fotocamera Post (MP)</label>
                    <input type="number" id="rear_cam" value="12">
                </div>
                <div class="form-group">
                    <label for="battery">🔋 Batteria (mAh)</label>
                    <input type="number" id="battery" value="3000" step="100">
                </div>
            </div>

            <div class="toggle-group">
                <div class="toggle-item">
                    <input type="checkbox" id="4g" checked>
                    <label for="4g">4G</label>
                </div>
                <div class="toggle-item">
                    <input type="checkbox" id="5g">
                    <label for="5g">5G</label>
                </div>
            </div>

            <button id="predict-btn">🔮 Calcola Prezzo Giusto</button>
        </section>

        <div id="result-wrapper">
            <!-- Risultati iniettati qui -->
        </div>

        <footer>
            <p>DealHunter - Logistic Regression Model | Accuracy: ~65%</p>
            <p>© 2026 Infrastruttura DealHunter</p>
        </footer>
    </div>

    <script>
        const PRICE_RANGES = {
            'Budget': '< 150€',
            'Mid-Range': '150€ - 300€',
            'High-End': '300€ - 600€',
            'Premium': '> 600€'
        };

        const CATEGORIES = ['Budget', 'Mid-Range', 'High-End', 'Premium'];

        document.getElementById('predict-btn').addEventListener('click', function() {
            const btn = this;
            btn.innerHTML = '⏳ Elaborazione...';
            btn.disabled = true;

            // Simulazione ritardo computazionale (wow factor)
            setTimeout(() => {
                calculatePrediction();
                btn.innerHTML = '🔮 Calcola Prezzo Giusto';
                btn.disabled = false;
            }, 800);
        });

        function calculatePrediction() {
            const ram = parseFloat(document.getElementById('ram').value);
            const memory = parseFloat(document.getElementById('memory').value);
            const year = parseInt(document.getElementById('year').value);
            const brand = document.getElementById('brand').value;

            // Heuristic Logic (Porting di predictor.py)
            // Semplificata per JS puro senza backend pickle
            let score = 0;
            score += (ram * 10);
            score += (memory / 2);
            score += (year - 2010) * 5;
            
            if (brand === 'Apple' || brand === 'Samsung') score += 50;

            let prediction = '';
            let probabilities = [0.1, 0.2, 0.4, 0.3]; // Default fallback

            if (score < 100) {
                prediction = 'Budget';
                probabilities = [0.75, 0.15, 0.08, 0.02];
            } else if (score < 180) {
                prediction = 'Mid-Range';
                probabilities = [0.10, 0.70, 0.15, 0.05];
            } else if (score < 250) {
                prediction = 'High-End';
                probabilities = [0.05, 0.15, 0.65, 0.15];
            } else {
                prediction = 'Premium';
                probabilities = [0.02, 0.08, 0.20, 0.70];
            }

            renderResult(prediction, probabilities);
        }

        function renderResult(prediction, probas) {
            const wrapper = document.getElementById('result-wrapper');
            const range = PRICE_RANGES[prediction];
            const confidence = (probas[CATEGORIES.indexOf(prediction)] * 100).toFixed(1);

            wrapper.innerHTML = `
                <div id="result-display" style="display: block;">
                    <div class="result-box result-${prediction}">
                        <h2>${getIcon(prediction)} Fascia: ${prediction}</h2>
                        <p>Prezzo stimato: <strong>${range}</strong></p>
                    </div>

                    <div class="metric-container">
                        <div class="metric">
                            <div class="metric-value">${confidence}%</div>
                            <div class="metric-label">🎯 Confidenza</div>
                        </div>
                    </div>

                    <div class="card chart-container">
                        <h3 style="margin-bottom: 1.5rem; color: var(--primary);">📊 Distribuzione Probabilità</h3>
                        ${CATEGORIES.map((cat, i) => `
                            <div class="chart-item">
                                <div class="chart-label">
                                    <span>${cat}</span>
                                    <span>${(probas[i] * 100).toFixed(0)}%</span>
                                </div>
                                <div class="chart-bar">
                                    <div class="chart-fill" style="width: 0%" data-width="${probas[i] * 100}%"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            // Trigger animation
            setTimeout(() => {
                document.querySelectorAll('.chart-fill').forEach(el => {
                    el.style.width = el.getAttribute('data-width');
                });
            }, 100);

            wrapper.scrollIntoView({ behavior: 'smooth' });
        }

        function getIcon(cat) {
            switch(cat) {
                case 'Budget': return '💰';
                case 'Mid-Range': return '⚖️';
                case 'High-End': return '🚀';
                case 'Premium': return '💎';
                default: return '📱';
            }
        }
    </script>
</body>
</html>
